name: Sync LinkedWild discussions

on:
  schedule:
    - cron: '17 * * * *'  # hourly, off the hour to avoid herd
  workflow_dispatch:
  discussion:
    types: [created, edited, deleted, transferred]

permissions:
  contents: write
  discussions: read

concurrency:
  group: sync-discussions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync discussions.json from LinkedWild category
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-discussions.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/discussions.json; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discussions.json
          git commit -m "chore(linkedwild): auto-sync discussions.json"
          git push
